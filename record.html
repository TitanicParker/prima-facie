<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinical record | Source browser</title><style>body{margin:0;background:#101923;color:#eee;font:16px/1.5 system-ui}main{max-width:950px;margin:0 auto;padding:25px 20px}a{color:#e9c88f}input{font:inherit;padding:13px;width:min(100%,530px);box-sizing:border-box}button{padding:12px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2c38;border-radius:10px;padding:18px;font:14px/1.7 monospace}.result{display:block;width:100%;text-align:left;background:#203541;color:#eee;border:1px solid #405d68;margin:8px 0;padding:10px;border-radius:8px}p{color:#b7c9cd}</style></head><body><main><p><a href="./index.html">← Case archive</a> · <a href="./REPAIRED_CANONICAL_V2.md">Original Markdown record</a></p><h1>Clinical record</h1><p>Search the canonical transcription or enter a CLIN identifier. Results show the source lines in context. Nothing is altered in the underlying file.</p><input id="query" placeholder="e.g. CLIN-001142, clonazepam, toe-clawing" aria-label="Search record"><button id="search">Search</button><p id="status">Loading record…</p><div id="matches"></div><h2 id="label">Source context</h2><pre id="context">Choose a search result.</pre><button id="previous">← Earlier</button><button id="next">Later →</button></main><script>let lines=[],at=0;const q=document.getElementById('query'),status=document.getElementById('status'),matches=document.getElementById('matches'),context=document.getElementById('context'),label=document.getElementById('label');function show(n){at=Math.max(0,Math.min(lines.length-1,n));let a=Math.max(0,at-15),b=Math.min(lines.length,at+30);context.textContent=lines.slice(a,b).join('\n');label.textContent='Record lines '+(a+1)+'–'+b;label.scrollIntoView({behavior:'smooth'})}function search(){const needle=q.value.trim().toLowerCase();matches.replaceChildren();if(!needle)return;let hits=[];for(let i=0;i<lines.length;i++)if(lines[i].toLowerCase().includes(needle))hits.push(i);status.textContent=hits.length+' matching lines'+(hits.length>80?' (first 80 shown)':'');hits.slice(0,80).forEach(i=>{let b=document.createElement('button');b.className='result';b.textContent=lines[i].slice(0,270);b.onclick=()=>show(i);matches.append(b)});if(hits.length===1)show(hits[0])}document.getElementById('search').onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()};document.getElementById('previous').onclick=()=>show(at-30);document.getElementById('next').onclick=()=>show(at+30);fetch('./REPAIRED_CANONICAL_V2.md').then(r=>{if(!r.ok)throw Error('Record not found');return r.text()}).then(t=>{lines=t.split(/\r?\n/);status.textContent=lines.length+' source lines loaded';const query=new URLSearchParams(location.search).get('q');if(query){q.value=query;search()}}).catch(e=>status.textContent='Unable to load source: '+e.message);</script></body></html>
